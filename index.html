<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/splash/apple-touch-icon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="JobLog" />
        <title>joblog</title>
        <script>
            // 첫 화면부터 저장된 테마와 상태바 색을 맞춰 깜빡임을 막는다
            ;(function () {
                try {
                    var mode = localStorage.getItem("joblog-theme") || "system"
                    var dark =
                        mode === "dark" ||
                        (mode !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
                    var root = document.documentElement
                    if (dark) root.classList.add("dark")
                    root.style.colorScheme = dark ? "dark" : "light"
                    var metas = document.querySelectorAll('meta[name="theme-color"]')
                    for (var i = 0; i < metas.length; i++) {
                        metas[i].removeAttribute("media")
                        metas[i].setAttribute("content", dark ? "#0e1116" : "#ffffff")
                    }
                } catch (e) {}
            })()
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
